_schema-version: 3.3.0
ID: Cambridge
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx -p @sap/cds-dk cds build --profile production,node
modules:
  - name: cambridge-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      memory: 256M
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: cambridge-db
      - name: cambridge-auth
  - name: cambridge-db-deployer
    type: hdb
    path: gen/db
    parameters:
        instances: 1
        buildpack: nodejs_buildpack
    requires:
      - name: cambridge-db    
        properties:
          TARGET_CONTAINER: ~{hdi-container-service}
      - name: harvard-db
        group: SERVICE_REPLACEMENTS
        properties:
          key: harvard-db
          service: ~{harvard-db-service}

resources:
  - name: cambridge-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-container-service: ${service-name}
      
  - name: harvard-db
    type: org.cloudfoundry.existing-service  
    parameters:
        service-name: harvard-db
    properties:
      harvard-db-service: ${service-name}
  - name: cambridge-auth
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        tenant-mode: dedicated
        xsappname: cambridge-${org}-${space}
      path: ./xs-security.json
      service: xsuaa
      service-name: cambridge-auth
      service-plan: application
