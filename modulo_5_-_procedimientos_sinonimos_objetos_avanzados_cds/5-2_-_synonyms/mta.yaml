_schema-version: 3.3.0
ID: Harvard
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx -p @sap/cds-dk cds build --profile production,node
modules:
  - name: harvard-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      memory: 256M
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: harvard-db
      - name: harvard-auth
  - name: harvard-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: harvard-db
    parameters:
      instances: 1
      buildpack: nodejs_buildpack

resources:
  - name: harvard-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: harvard-auth
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        tenant-mode: dedicated
        xsappname: harvard
      path: ./xs-security.json
      service: xsuaa
      service-name: harvard-auth
      service-plan: application
